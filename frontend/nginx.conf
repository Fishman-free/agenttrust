server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # trailingSlash: true 会生成 /agents/index.html；$uri/ 保证直接访问深链安全回退。
    # 未知路由：=404 触发 error_page 返回真实 HTTP 404 状态码（/404.html 内部重定向会返回 200）。
    error_page 404 /404.html;

    # Healthy only after setup atomically publishes four-contract bytecode/wiring readiness.
    location = /healthz {
        access_log off;
        log_not_found off;
        default_type text/plain;
        alias /readiness/contracts-ready;
        error_page 404 =503 @contracts_not_ready;
    }

    location @contracts_not_ready {
        access_log off;
        default_type text/plain;
        return 503 "contracts not ready\n";
    }

    location /api/auth/ {
        proxy_pass http://auth-bff:8323;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 带 hash 的静态资源可长缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
