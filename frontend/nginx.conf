server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js 静态导出：/agents 等路由生成 agents.html，需 $uri.html 回退
    # 根路径：$uri=/ 是目录，try_files 不会命中 index.html，需单独 location 显式指定
    # 未知路由：=404 触发 error_page 返回真实 HTTP 404 状态 + 404 页面
    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # 带 hash 的静态资源可长缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
