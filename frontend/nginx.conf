server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js 静态导出：/agents 等路由生成 agents.html，需 $uri.html 回退
    location / {
        try_files $uri $uri.html /404.html =404;
    }

    # 带 hash 的静态资源可长缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
