server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # trailingSlash: true 会生成 /agents/index.html；$uri/ 保证直接访问深链安全回退。
    location / {
        try_files $uri $uri/ /404.html =404;
    }

    # 带 hash 的静态资源可长缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
