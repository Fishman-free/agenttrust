server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # trailingSlash: true 会生成 /agents/index.html；$uri/ 保证直接访问深链安全回退。
    # 未知路由：=404 触发 error_page 返回真实 HTTP 404 状态码（/404.html 内部重定向会返回 200）。
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 带 hash 的静态资源可长缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
