# Enable auto-merge for trusted same-repository zcode/* PRs
# (repository owner and the trusted collaborator).
# Merging still requires every protected status check to pass. The event actor is
# pinned so another collaborator cannot refresh auto-merge by pushing to the branch.
# Note: the Actions bot cannot approve PRs (GitHub restriction), so the required-review
# protection rule is removed by owner decision; CI gates remain mandatory.
name: Auto Merge Trusted PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge-trusted:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'zcode/') &&
      (
        (
          github.event.pull_request.user.login == 'KerryChia' &&
          github.event.sender.login == 'KerryChia' &&
          github.event.pull_request.author_association == 'COLLABORATOR'
        ) || (
          github.event.pull_request.user.login == 'Fishman-free' &&
          github.event.sender.login == 'Fishman-free' &&
          github.event.pull_request.author_association == 'OWNER'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge after protected checks
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
