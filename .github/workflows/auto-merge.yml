# Auto-approve and enable auto-merge only for KerryChia's same-repository zcode/* PRs.
# The event actor is also pinned so another collaborator cannot refresh approval by pushing to the branch.
name: Auto Approve and Merge Trusted Collaborator PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve-and-merge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'KerryChia' &&
      github.event.sender.login == 'KerryChia' &&
      github.event.pull_request.author_association == 'COLLABORATOR' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'zcode/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve the trusted collaborator revision
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge after protected checks
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
