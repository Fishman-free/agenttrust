# GitHub Pages 静态部署：构建 frontend（Base Sepolia 模式）并发布到 Pages。
# 前置：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
# 子路径部署：默认 basePath=/<repo>（如 /multiagent），若用自定义域名或根路径部署，
# 可删除 NEXT_PUBLIC_BASE_PATH 环境变量（需同时改 next.config.ts 的 basePath 来源）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build (Base Sepolia mode)
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_CHAIN: base-sepolia
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - uses: actions/deploy-pages@v4
