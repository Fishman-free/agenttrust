# GitHub Pages publishes an explicit read-only Base Sepolia research preview.
# A writable build remains disabled until deployments/84532.json contains a verified deployment.
name: Deploy read-only research preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check generated deployment configuration
        run: node scripts/deployment-manifest.mjs check

      - name: Enforce explicit read-only Base Sepolia preview
        run: node -e "const d=require('./deployments/84532.json'); if(d.status!=='undeployed') throw new Error('Pages is intentionally read-only; update this workflow only after a separately approved and verified deployment')"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test configuration guard
        run: npm test -- __tests__/config.test.ts
        working-directory: frontend

      - name: Build read-only Base Sepolia preview
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_CHAIN: base-sepolia
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
