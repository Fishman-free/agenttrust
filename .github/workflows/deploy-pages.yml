# GitHub Pages publishes an explicit read-only Base Sepolia research preview.
# A writable build remains disabled until deployments/84532.json contains a verified deployment.
name: Deploy read-only research preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check generated deployment configuration
        run: node scripts/deployment-manifest.mjs check

      - name: Enforce explicit read-only Base Sepolia preview
        run: node -e "const d=require('./deployments/84532.json'); if(d.status!=='undeployed') throw new Error('Pages is intentionally read-only; update this workflow only after a separately approved and verified deployment')"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test configuration guard
        run: npm test -- __tests__/config.test.ts
        working-directory: frontend

      - name: Build read-only Base Sepolia preview
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_CHAIN: base-sepolia
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - uses: actions/deploy-pages@v4
        id: deployment
