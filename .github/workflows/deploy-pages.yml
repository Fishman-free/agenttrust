# GitHub Pages publishes the RPC-validated Base Sepolia deployment.
name: Deploy Base Sepolia app

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # 手动补部署入口。
  # `auto-merge.yml` 用 GITHUB_TOKEN 执行 `gh pr merge --auto --squash`，而 GitHub 会抑制
  # GITHUB_TOKEN 引发的连锁工作流 —— 因此 auto-merge 落到 main 的合并**不会**产生 push 事件，
  # main 上的 push CI 也就不会跑，只依赖 workflow_run 会让 Pages 长期停在旧版本。
  # 加 workflow_dispatch 后，合并完只需 `gh workflow run "Deploy Base Sepolia app" --ref main`
  # 即可把 Pages 拉到最新。
  workflow_dispatch:
  # 每日兜底重建。
  # 上面两个入口都要人来记：dispatch 要手动敲，workflow_run 又等不到 auto-merge 的 push。
  # cron 由 GitHub 自己发起，不受 GITHUB_TOKEN 的连锁抑制，所以是唯一能确定生效、
  # 又不需要额外 secret（PAT）的自动兜底。Pages 落后最多一天，重建是幂等的。
  schedule:
    - cron: "17 2 * * *"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_dispatch 时没有 workflow_run 上下文，退回当前 ref（默认是 main）。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check generated deployment configuration
        run: node scripts/deployment-manifest.mjs check

      - name: Enforce verified Base Sepolia deployment
        run: node -e "const d=require('./deployments/84532.json'); if(d.status!=='deployed'||Object.values(d.contracts).some(a=>/^0x0{40}$/i.test(a))) throw new Error('Pages requires a nonzero, deployed Base Sepolia manifest')"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test configuration guard
        run: npm test -- __tests__/config.test.ts
        working-directory: frontend

      - name: Resolve Pages base path
        id: pages-base
        # GITHUB_REPOSITORY 恒为 owner/repo，与事件类型无关；
        # github.event.repository.name 在 schedule 事件里不保证存在。
        run: echo "value=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Build Base Sepolia app
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_CHAIN: base-sepolia
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages-base.outputs.value }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
