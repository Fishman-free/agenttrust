# AgentTrust 一键本地启动：docker compose up
#   浏览器打开 http://localhost:3000 即可使用，无需手动装 Node/Foundry/anvil。
#
# 服务：
#   postgres  —— Auth BFF 的本地持久化数据库（仅 Compose 内网）
#   auth-bff  —— 同源会话与 SIWE 钱包认证服务（仅 Compose 内网）
#   anvil     —— 本地演示链（foundry 镜像），端口映射 8545（宿主）
#   setup     —— 一次性容器：forge script 部署四合约到 anvil 并校验（成功后退出）
#   frontend  —— 静态导出前端（nginx），端口映射 3000，并反代 /api/auth/*
#
# 网络模型（关键）：
#   - 容器内：setup 经服务名访问 anvil → http://anvil:8545（compose 内网）
#   - 浏览器：前端页面连 http://127.0.0.1:8545（anvil 映射到宿主 8545）
#     RPC 地址来自 deployments/31337.json 生成的前端模块。
#
# 地址模型：
#   deployments/31337.json 是确定性地址的唯一来源，生成 frontend/lib/deployments.ts。
#   setup 对四个具名地址、字节码、依赖、角色授权和所有权逐项校验。
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: auth_bff
      POSTGRES_USER: auth_bff
      POSTGRES_PASSWORD: local-auth-only
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_bff -d auth_bff"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - agenttrust

  auth-bff:
    build:
      context: ./auth-bff
    image: agenttrust-auth-bff
    command: ["/bin/sh", "-c", "node dist/src/migrate.js && node dist/src/server.js"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "8323"
      DATABASE_URL: postgresql://auth_bff:local-auth-only@postgres:5432/auth_bff
      AUTH_ORIGIN: http://localhost:3000
      # 浏览器把 localhost 与 127.0.0.1 视作两个不同 Origin，而 Origin 校验是精确字符串比较：
      # 只认 localhost 会让从 127.0.0.1 打开站点的所有写请求（钱包挑战/校验、OIDC 起跳）全部 403，
      # 表现为「钱包连上了但点登录没反应」。这里把两个本地入口都放行。
      AUTH_ORIGINS: http://127.0.0.1:3000
      SIWE_DOMAIN: localhost:3000
      SIWE_URI: http://localhost:3000
      SIWE_CHAIN_ID: "31337"
      RETURN_TO_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      COOKIE_NAME: auth_session
      SESSION_TTL_SECONDS: "604800"
      CHALLENGE_TTL_SECONDS: "300"
      OIDC_FLOW_TTL_SECONDS: "600"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8323/api/auth/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks:
      - agenttrust

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint: ["anvil"]
    # v1.7.1 supports --state as load+dump and --state-interval for periodic durable snapshots.
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--port", "8545", "--state", "/home/foundry/state.json", "--state-interval", "1"]
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      # Mount the image's foundry-owned home so the non-root UID 1000 can write state.json.
      - anvil-data:/home/foundry
    healthcheck:
      test: ["CMD-SHELL", "test \"$(cast chain-id --rpc-url http://127.0.0.1:8545 2>/dev/null)\" = 31337"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped
    networks:
      - agenttrust

  setup:
    build:
      context: .
      dockerfile: contracts/Dockerfile
    image: agenttrust-setup
    # Named-volume roots are created as root on Linux Docker and Docker Desktop.
    user: "0:0"
    environment:
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      MANIFEST_PATH: /app/deployments/31337.json
      READY_FILE: /readiness/contracts-ready
      PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - deployment-readiness:/readiness
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"
    networks:
      - agenttrust

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CHAIN: anvil
    image: agenttrust-frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - deployment-readiness:/readiness:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      auth-bff:
        condition: service_healthy
    healthcheck:
      # 容器内 localhost 解析到 ::1 (IPv6)，nginx 仅监听 IPv4 0.0.0.0，故用 127.0.0.1
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - agenttrust

networks:
  agenttrust:

volumes:
  anvil-data:
  auth-postgres-data:
  deployment-readiness:
