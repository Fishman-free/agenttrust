# AgentTrust 一键本地启动：docker compose up
#   浏览器打开 http://localhost:3000 即可使用，无需手动装 Node/Foundry/anvil。
#
# 服务：
#   anvil     —— 本地演示链（foundry 镜像），端口映射 8545（宿主）
#   setup     —— 一次性容器：forge script 部署四合约到 anvil 并校验（成功后退出）
#   frontend  —— 静态导出前端（nginx），端口映射 3000
#
# 网络模型（关键）：
#   - 容器内：setup 经服务名访问 anvil → http://anvil:8545（compose 内网）
#   - 浏览器：前端页面连 http://127.0.0.1:8545（anvil 映射到宿主 8545）
#     frontend/lib/config.ts 的 anvil RPC 地址对浏览器侧是正确的，无需改动。
#
# 地址模型：
#   anvil 全新启动为确定性地址（0x5fBDB231… 等），与 config.ts 的 anvil 分支一致。
#   setup 部署后用 cast 动态校验代码存在；前端直接用内置确定性地址。
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: agenttrust-anvil
    # foundry 镜像 ENTRYPOINT 是 ["/bin/sh","-c"]：数组 command 会被 Docker 追加为位置参数
    # （/bin/sh -c anvil --host …），flag 全被当作 $0/$1，最终只执行裸 anvil → 默认监听 127.0.0.1，
    # 容器间无法访问。解决：entrypoint 直接指向 anvil 二进制，参数经数组 command 原样传递。
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--port", "8545"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped
    networks:
      - agenttrust

  setup:
    build:
      context: ./contracts
    image: agenttrust-setup
    container_name: agenttrust-setup
    environment:
      RPC_URL: http://anvil:8545
      PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"
    networks:
      - agenttrust

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CHAIN: anvil
    image: agenttrust-frontend
    container_name: agenttrust-frontend
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      # 容器内 localhost 解析到 ::1 (IPv6)，nginx 仅监听 IPv4 0.0.0.0，故用 127.0.0.1
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - agenttrust

networks:
  agenttrust:
    name: agenttrust-net
